name: Build and push Docker image

on:
  push:
    branches: [main]

# Le job build redeclare ce dont il a besoin; les autres n'ecrivent rien.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Testcontainers demarre un PostgreSQL jetable pour verifier que les
      # migrations Flyway produisent un schema conforme aux entites JPA
      # (ddl-auto=validate). Docker est preinstalle sur les runners ubuntu.
      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

  # Publie le graphe complet des dependances Gradle, transitives comprises, pour
  # que Dependabot puisse alerter dessus: build.gradle ne nomme que les directes,
  # et c'est dans les transitives (Tomcat, Jackson, okhttp...) que les CVE tombent.
  # Le lockfile npm, lui, est deja analyse sans rien publier.
  dependency-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/dependency-submission@v4
        with:
          build-root-directory: backend

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/tdw1302/accounting-assistant:latest
            ghcr.io/tdw1302/accounting-assistant:${{ github.sha }}
