name: Build and push Docker image

on:
  push:
    branches: [main]
  # Sans cela une PR n'a aucune verification: les montees de version proposees
  # par Dependabot arrivaient sans le moindre signal, et il fallait les essayer
  # une a une en local pour savoir lesquelles tenaient.
  pull_request:
    branches: [main]

# Le job build redeclare ce dont il a besoin; les autres n'ecrivent rien.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      # Testcontainers demarre un PostgreSQL jetable pour verifier que les
      # migrations Flyway produisent un schema conforme aux entites JPA
      # (ddl-auto=validate). Docker est preinstalle sur les runners ubuntu.
      - name: Run backend tests
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: backend/build/reports/tests/test/
          retention-days: 7

  # Publie le graphe complet des dependances Gradle, transitives comprises, pour
  # que Dependabot puisse alerter dessus: build.gradle ne nomme que les directes,
  # et c'est dans les transitives (Tomcat, Jackson, okhttp...) que les CVE tombent.
  # Le lockfile npm, lui, est deja analyse sans rien publier.
  dependency-graph:
    # Le graphe decrit l'etat de main, pas celui d'une proposition.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      # La soumission echoue tant que le graphe de dependances n'est pas active sur
      # le depot (Settings > Advanced Security > Dependency graph): il est desactive
      # par defaut sur les depots prives. Le job resout et publie le graphe des qu'il
      # l'est, sans qu'il y ait rien a changer ici; d'ici la il n'a pas a rendre main
      # rouge, l'erreur restant visible dans son journal.
      - uses: gradle/actions/dependency-submission@v6
        with:
          build-root-directory: backend
          dependency-graph-continue-on-failure: true

  build:
    # Une PR ne publie pas d'image: elle n'a pas a ecraser le tag latest du registre.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/tdw1302/accounting-assistant:latest
            ghcr.io/tdw1302/accounting-assistant:${{ github.sha }}
