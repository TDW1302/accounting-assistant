plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'be.vercauteren'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// spring-boot-flyway porte l'auto-configuration: depuis Spring Boot 4 elle
	// n'est plus dans spring-boot-autoconfigure et flyway-core seul ne suffit pas.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.apache.pdfbox:pdfbox:3.0.8'
	// Le JDK n'a aucun lecteur WebP: sans ce plugin ImageIO, une photo WebP passait
	// la validation du depot puis echouait a la conversion en PDF.
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.3'
	implementation 'com.anthropic:anthropic-java:2.68.0'
	implementation 'com.google.genai:google-genai:1.75.0'
	implementation 'org.apache.poi:poi-ooxml:5.5.1'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation platform('org.testcontainers:testcontainers-bom:1.21.4')
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// MockMvc et les post-processeurs user()/csrf(): depuis Spring Boot 4, chaque
	// technologie a son starter de test, spring-boot-starter-test ne les porte plus.
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

jacoco {
	toolVersion = '0.8.14'
}

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
		html.required = false
	}
}
