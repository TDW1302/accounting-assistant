spring.application.name=accounting-assistant

# H2 Database - fichier persistant
spring.datasource.url=jdbc:h2:file:./data/accounting
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload
app.upload.directory=C:/Users/verca/IdeaProjects/accounting-assistant/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
