spring.application.name=accounting-assistant

# H2 Database - fichier persistant
spring.datasource.url=jdbc:h2:file:./data/accounting
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# File upload
app.upload.directory=C:/Users/verca/IdeaProjects/accounting-assistant/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin initial
app.admin.username=admin
app.admin.password=admin123
app.admin.email=admin@example.com

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict

# Anthropic Claude API
app.anthropic.api-key=${ANTHROPIC_API_KEY}
app.anthropic.model=claude-sonnet-4-5-20250929

# Falco API
app.falco.api-key=${FALCO_API_KEY}
app.falco.app-secret=${FALCO_APP_SECRET}
app.falco.base-url=https://api.falco-app.be/v1
