spring.application.name=accounting-assistant

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/accounting}
spring.datasource.username=${DB_USERNAME:accounting}
spring.datasource.password=${DB_PASSWORD:changeme}

# JPA - le schema est gere par Flyway, Hibernate se contente de le verifier
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway - migrations versionnees dans db/migration
spring.flyway.enabled=true

# File upload
app.upload.directory=${UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Notre propre numero d'entreprise. Une facture porte celui de l'emetteur et celui
# du destinataire: le connaitre permet d'ecarter le notre quand l'IA le rend a la
# place de celui du fournisseur. Laisser vide desactive le controle.
app.company.enterprise-number=${COMPANY_ENTERPRISE_NUMBER:}

# Admin initial
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:admin@example.com}

# L'application est servie derriere nginx puis Caddy: sans cette strategie
# request.isSecure() reste faux, et avec lui l'en-tete HSTS configure dans
# SecurityConfig n'est jamais emis et le cookie XSRF-TOKEN part sans Secure.
# nginx n'expose qu'une valeur de X-Forwarded-For qu'il a lui-meme etablie
# (cf. nginx.conf), l'en-tete n'est donc pas sous controle du client.
server.forward-headers-strategy=framework

# Session
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}

# Anthropic Claude API
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
app.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-4-5-20250929}

# Google Gemini API
app.gemini.api-key=${GEMINI_API_KEY:}
app.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}

# Falco API
app.falco.enabled=${FALCO_ENABLED:false}
app.falco.api-key=${FALCO_API_KEY:}
app.falco.app-secret=${FALCO_APP_SECRET:}
app.falco.base-url=${FALCO_BASE_URL:https://api.sandbox.falco-app.be/v1}

# Inbox
app.inbox.directory=${INBOX_DIR:./inbox}
app.inbox.enabled=${INBOX_ENABLED:true}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

server.error.include-stacktrace=never
