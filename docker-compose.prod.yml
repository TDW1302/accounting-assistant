services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8443:8443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  app:
    image: ghcr.io/tdw1302/accounting-assistant:latest
    expose:
      - "80"
    env_file:
      - .env
    volumes:
      - accounting-data:/data/db
      - accounting-uploads:/data/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

volumes:
  accounting-data:
  accounting-uploads:
  caddy-data:
  caddy-config:
