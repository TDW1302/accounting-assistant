services:
  caddy:
    image: serfriz/caddy-duckdns:latest
    ports:
      - "8999:8999"
    environment:
      - DUCKDNS_API_TOKEN=${DUCKDNS_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  app:
    image: ghcr.io/tdw1302/accounting-assistant:latest
    expose:
      - "80"
    env_file:
      - .env
    volumes:
      - accounting-data:/data/db
      - accounting-uploads:/data/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

volumes:
  accounting-data:
  accounting-uploads:
  caddy-data:
  caddy-config:
