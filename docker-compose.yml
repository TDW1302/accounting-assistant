services:
  app:
    build: .
    ports:
      - "8080:80"
    env_file:
      - .env
    volumes:
      - accounting-data:/data/db
      - accounting-uploads:/data/uploads
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'

volumes:
  accounting-data:
  accounting-uploads:
