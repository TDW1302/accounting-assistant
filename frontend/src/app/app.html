@if (authService.isAuthenticated()) {
  <nav class="navbar">
    <a class="nav-brand" routerLink="/invoices">Comptabilité</a>
    <div class="nav-links">
      <a routerLink="/invoices" routerLinkActive="active">Factures</a>
      <a routerLink="/peppol" routerLinkActive="active">Peppol</a>
      <a routerLink="/suppliers" routerLinkActive="active">Fournisseurs</a>
      @if (authService.hasRole('ADMIN')) {
        <a routerLink="/users" routerLinkActive="active">Utilisateurs</a>
      }
    </div>
    <div class="nav-user">
      <span class="username">{{ authService.currentUser()?.username }}</span>
      <a routerLink="/change-password">Changer mdp</a>
      <button class="btn-logout" (click)="logout()">Déconnexion</button>
    </div>
  </nav>
}
<main class="container">
  <router-outlet />
</main>
