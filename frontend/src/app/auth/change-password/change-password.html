<div class="change-password-container">
  <h1>Changer le mot de passe</h1>

  @if (isExpired) {
    <div class="warning-message">
      Votre mot de passe a expiré. Veuillez le changer pour continuer.
    </div>
  }

  @if (error) {
    <div class="error-message">{{ error }}</div>
  }

  @if (success) {
    <div class="success-message">Mot de passe changé avec succès. Redirection...</div>
  }

  <form (ngSubmit)="changePassword()">
    <div class="form-group">
      <label for="currentPassword">Mot de passe actuel</label>
      <input id="currentPassword" type="password" [(ngModel)]="currentPassword"
             name="currentPassword" required autofocus>
    </div>

    <div class="form-group">
      <label for="newPassword">Nouveau mot de passe</label>
      <input id="newPassword" type="password" [(ngModel)]="newPassword"
             name="newPassword" placeholder="Min. 6 caractères" required minlength="6">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"
              [disabled]="!currentPassword || !newPassword || newPassword.length < 6">
        Changer le mot de passe
      </button>
    </div>
  </form>
</div>
