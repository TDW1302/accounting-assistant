<div class="register-container">
  <h1>Inscription</h1>

  @if (error) {
    <div class="error-message">{{ error }}</div>
  }

  <form (ngSubmit)="register()">
    <div class="form-group">
      <label for="username">Nom d'utilisateur</label>
      <input id="username" type="text" [(ngModel)]="username" name="username"
             placeholder="Nom d'utilisateur (min. 3 caractères)" required minlength="3" autofocus>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" [(ngModel)]="email" name="email"
             placeholder="email@example.com" required>
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" [(ngModel)]="password" name="password"
             placeholder="Mot de passe (min. 6 caractères)" required minlength="6">
    </div>

    <div class="form-actions">
      <button type="submit" class="btn btn-primary"
              [disabled]="!username || !email || !password || username.length < 3 || password.length < 6">
        S'inscrire
      </button>
      <a routerLink="/login" class="btn">Retour à la connexion</a>
    </div>
  </form>
</div>
