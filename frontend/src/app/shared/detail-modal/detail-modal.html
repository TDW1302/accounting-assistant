<div class="detail-overlay" (click)="close()">
  <div class="detail-modal" (click)="$event.stopPropagation()">
    <div class="detail-header">
      <h2>{{ title() }}</h2>
      <button class="btn btn-sm" (click)="close()" aria-label="Fermer">✕</button>
    </div>

    <div class="detail-body">
      <ng-content />
    </div>

    <div class="detail-actions">
      <ng-content select="[detail-action]" />
      <button class="btn" (click)="close()">Fermer</button>
    </div>
  </div>
</div>
