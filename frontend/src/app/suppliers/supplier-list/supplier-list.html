<div class="page-header">
  <h1>Fournisseurs</h1>
  <div class="header-actions">
    <select [(ngModel)]="categoryFilter" (ngModelChange)="load()">
      <option [ngValue]="null">-- Toutes les catégories --</option>
      @for (c of categories; track c.value) {
        <option [ngValue]="c.value">{{ c.label }}</option>
      }
    </select>
    <a class="btn btn-primary" routerLink="/suppliers/new">+ Nouveau fournisseur</a>
  </div>
</div>

<div class="table-wrapper">
<table>
  <thead>
    <tr>
      <th>Nom</th>
      <th>Alias</th>
      <th>N° entreprise</th>
      <th>Catégorie</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    @for (s of suppliers(); track s.id) {
      <tr>
        <td>{{ s.name }}</td>
        <td class="mono">{{ s.alias }}</td>
        <td>{{ s.enterpriseNumber }}</td>
        <td>{{ categoryLabel(s.category) }}</td>
        <td class="actions">
          <a class="btn btn-sm" [routerLink]="['/suppliers', s.id, 'edit']">Modifier</a>
          <button class="btn btn-sm btn-danger" (click)="deleteSupplier(s)">Supprimer</button>
        </td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5" class="empty">Aucun fournisseur.</td>
      </tr>
    }
  </tbody>
</table>
</div>
