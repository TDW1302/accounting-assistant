# L'application tourne derriere un second proxy (Caddy, cf. Caddyfile), donc
# $remote_addr vaut l'IP de ce proxy et non celle du client: sans real_ip, la
# zone ci-dessous ne compterait qu'une seule cle pour tout le monde, et cinq
# tentatives suffiraient a fermer le login a tous les utilisateurs.
#
# real_ip_recursive remonte la chaine X-Forwarded-For de droite a gauche en
# sautant les adresses declarees de confiance, et s'arrete a la premiere qui ne
# l'est pas: le client. Restreindre set_real_ip_from au seul reseau du proxy
# amont est plus sur que les plages privees completes listees ici.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;

    # Cache static assets with hashed filenames
    location ~* \.[0-9a-f]+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/auth/login {
        limit_req zone=login burst=3 nodelay;
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr et non $proxy_add_x_forwarded_for: real_ip a deja resolu le
        # client, et repasser la chaine entrante laisserait des valeurs choisies
        # par le client dans l'en-tete que l'application lit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr et non $proxy_add_x_forwarded_for: real_ip a deja resolu le
        # client, et repasser la chaine entrante laisserait des valeurs choisies
        # par le client dans l'en-tete que l'application lit.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 10M;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
